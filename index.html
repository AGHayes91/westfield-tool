<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westfield Inventory Tool</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        .upload-box { background: #e9ecef; padding: 20px; border-radius: 6px; border: 2px dashed #ced4da; text-align: center; }
        input[type="file"] { margin-top: 10px; }
        #searchInput { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 4px; display: none; box-sizing: border-box; }
        #status { font-weight: bold; color: #007bff; margin-bottom: 10px; }
        .table-container { overflow-x: auto; margin-top: 20px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Westfield Parcel Inventory</h1>
    
    <div class="upload-box">
        <strong>Upload your CSV file:</strong><br>
        <input type="file" id="fileInput" accept=".csv">
    </div>

    <input type="text" id="searchInput" placeholder="Search metrics...">
    
    <div id="status">Waiting for file...</div>

    <div class="table-container">
        <table id="dataTable">
            <thead><tr id="headerRow"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const status = document.getElementById('status');
    const tableBody = document.getElementById('tableBody');
    const headerRow = document.getElementById('headerRow');

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Loading " + file.name + "...";
        
        const reader = new FileReader();

        reader.onload = function(event) {
            try {
                const text = event.target.result;
                const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
                
                headerRow.innerHTML = "";
                tableBody.innerHTML = "";

                // Headers
                const headers = rows[0].split(',');
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.innerText = h.replace(/['"]+/g, '');
                    headerRow.appendChild(th);
                });

                // Data
                for (let i = 1; i < rows.length; i++) {
                    const tr = document.createElement('tr');
                    const cells = rows[i].split(',');
                    cells.forEach(c => {
                        const td = document.createElement('td');
                        td.innerText = c.replace(/['"]+/g, '');
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }

                status.innerText = "Showing " + (rows.length - 1) + " rows.";
                searchInput.style.display = "block";

            } catch (err) {
                status.innerText = "Error reading file.";
            }
        };

        reader.readAsText(file);
    });

    searchInput.addEventListener('keyup', function() {
        const filter = searchInput.value.toLowerCase();
        const trs = tableBody.getElementsByTagName('tr');
        for (let i = 0; i < trs.length; i++) {
            trs[i].style.display = trs[i].textContent.toLowerCase().includes(filter) ? "" : "none";
        }
    });
</script>

</body>
</html>
