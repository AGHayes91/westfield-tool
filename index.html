<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pulte Strategy - Westfield</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 8px solid #2c3e50; }
        .warning { border-top-color: #e67e22; }
        .label { color: #7f8c8d; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 48px; font-weight: bold; color: #2c3e50; margin: 15px 0; }
        .footer { font-size: 14px; color: #27ae60; font-weight: 600; }
        
        /* Agent UI */
        #agent { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
        #chat { display: none; width: 320px; height: 400px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #ddd; margin-bottom: 15px; }
        .chat-h { background: #2c3e50; color: white; padding: 15px; font-weight: bold; text-align: center; }
        #flow { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; background: #fafafa; }
        .bot { background: #eee; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 85%; }
        .user { background: #3498db; color: white; padding: 10px; border-radius: 10px; align-self: flex-end; max-width: 85%; }
        .input { padding: 10px; border-top: 1px solid #eee; display: flex; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        #fab { width: 60px; height: 60px; background: #2c3e50; border-radius: 50%; color: white; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="header">
    <strong>PULTE STRATEGY GROUP</strong>
    <span>Market Intel: Westfield, IN</span>
</div>

<div class="dashboard">
    <div class="card">
        <div class="label">Total Westfield Parcels</div>
        <div class="value">27,859</div>
        <div class="footer">Verified GDB Source</div>
    </div>
    <div class="card warning">
        <div class="label">Months of Supply (MOS)</div>
        <div class="value">3.4</div>
        <div class="footer" style="color: #e67e22;">Supply Vacuum Detected</div>
    </div>
    <div class="card">
        <div class="label">Vacant Platted Lots</div>
        <div class="value">3,022</div>
        <div class="footer" style="color: #2980b9;">Ready for Pipeline</div>
    </div>
</div>

<div id="agent">
    <div id="chat">
        <div class="chat-h">Market Analyst AI</div>
        <div id="flow">
            <div class="bot">Verification complete. 27,859 parcels loaded. Ready for Pulte briefing.</div>
        </div>
        <div class="input">
            <input type="text" id="user-in" placeholder="Ask about the vacuum..." onkeypress="if(event.key==='Enter') send()">
        </div>
    </div>
    <button id="fab" onclick="toggle()">🤖</button>
</div>

<script>
    function toggle() {
        var c = document.getElementById('chat');
        c.style.display = (c.style.display === 'none' || c.style.display === '') ? 'flex' : 'none';
    }
    function send() {
        var i = document.getElementById('user-in');
        var f = document.getElementById('flow');
        if(!i.value.trim()) return;
        var u = document.createElement('div'); u.className = 'user'; u.innerText = i.value; f.appendChild(u);
        var v = i.value.toLowerCase(); i.value = "";
        setTimeout(function() {
            var b = document.createElement('div'); b.className = 'bot';
            if(v.includes('supply') || v.includes('vacuum')) {
                b.innerHTML = "<strong>Alert:</strong> Current inventory of 3,022 vacant lots provides only 3.4 months of supply based on Westfield absorption velocity.";
            } else {
                b.innerText = "Analyzing GDB parcel classes for acquisition strategy.";
            }
            f.appendChild(b); f.scrollTop = f.scrollHeight;
        }, 600);
    }
    // Auto-open
    setTimeout(toggle, 2000);
</script>

</body>
</html>
