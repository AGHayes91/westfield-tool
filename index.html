<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westfield AI Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f0f2f5; color: #1a202c; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: #2d3748; margin-top: 0; text-align: center; font-size: 1.5rem; }
        
        /* Upload Area */
        .upload-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 2px dashed #cbd5e0; text-align: center; margin-bottom: 20px; }
        input[type="file"] { margin-top: 10px; font-size: 0.9rem; }

        /* AI Chat Area */
        #aiSection { display: none; margin-bottom: 30px; padding: 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .chat-controls { display: flex; gap: 10px; }
        #askInput { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; outline: none; font-size: 1rem; }
        #askBtn { padding: 12px 24px; background: #3182ce; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #askBtn:hover { background: #2b6cb0; }
        
        #aiResponse { margin-top: 15px; padding: 15px; background: #ebf8ff; border-left: 4px solid #3182ce; border-radius: 4px; color: #2c5282; line-height: 1.5; font-size: 1.1rem; animation: fadeIn 0.3s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Table Area */
        .table-container { overflow-x: auto; margin-top: 20px; max-height: 400px; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border-bottom: 1px solid #edf2f7; padding: 10px; text-align: left; }
        th { background-color: #2d3748; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f7fafc; }
        #status { font-size: 0.8rem; color: #718096; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Westfield Property AI Agent</h1>
    
    <div class="upload-box" id="uploadBox">
        <strong>Step 1: Load Westfield Inventory CSV</strong><br>
        <input type="file" id="fileInput" accept=".csv">
    </div>

    <!-- AI Agent Interface -->
    <div id="aiSection">
        <p><strong>Step 2: Ask the Agent about the data</strong></p>
        <div class="chat-controls">
            <input type="text" id="askInput" placeholder="e.g., 'How many homes?' or 'Total parcels'...">
            <button id="askBtn">Ask Agent</button>
        </div>
        <div id="aiResponse" style="display:none;"></div>
    </div>

    <div id="status">Waiting for data...</div>

    <div class="table-container">
        <table id="dataTable">
            <thead><tr id="headerRow"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const askInput = document.getElementById('askInput');
    const askBtn = document.getElementById('askBtn');
    const aiResponse = document.getElementById('aiResponse');
    const aiSection = document.getElementById('aiSection');
    const tableBody = document.getElementById('tableBody');
    const headerRow = document.getElementById('headerRow');
    const status = document.getElementById('status');

    // Handle File Upload
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const text = event.target.result;
            const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
            
            headerRow.innerHTML = "";
            tableBody.innerHTML = "";

            const headers = rows[0].split(',');
            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h.replace(/['"]+/g, '');
                headerRow.appendChild(th);
            });

            for (let i = 1; i < rows.length; i++) {
                const tr = document.createElement('tr');
                const cells = rows[i].split(',');
                cells.forEach(c => {
                    const td = document.createElement('td');
                    td.innerText = c.replace(/['"]+/g, '');
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            }

            status.innerText = "Data Synced. Agent is Online.";
            aiSection.style.display = "block";
            document.getElementById('uploadBox').style.display = "none";
        };
        reader.readAsText(file);
    });

    // Smart AI Logic for Demo
    askBtn.addEventListener('click', function() {
        const query = askInput.value.toLowerCase().trim();
        if (!query) return;

        const rows = Array.from(tableBody.getElementsByTagName('tr'));
        let foundMatch = null;

        // Synonym Map to make the demo feel "smarter"
        const synonyms = {
            "total": ["total", "how many", "count", "parcels"],
            "vacant": ["vacant", "pipeline", "unbuilt", "left", "available"],
            "single family": ["single family", "houses", "homes", "residential"],
            "supply": ["supply", "years", "pace", "how long"],
            "commercial": ["commercial", "business", "land"],
            "townhome": ["townhome", "attached", "condo"]
        };

        // 1. Check for Synonym matches
        for (let metricKey in synonyms) {
            if (synonyms[metricKey].some(syn => query.includes(syn))) {
                // Find the row that matches the metricKey
                foundMatch = rows.find(row => row.cells[0].innerText.toLowerCase().includes(metricKey));
                if (foundMatch) break;
            }
        }

        // 2. If no synonym match, try a direct text match
        if (!foundMatch) {
            foundMatch = rows.find(row => row.cells[0].innerText.toLowerCase().includes(query) || query.includes(row.cells[0].innerText.toLowerCase()));
        }

        if (foundMatch) {
            const metricName = foundMatch.cells[0].innerText;
            const countValue = foundMatch.cells[1].innerText;
            aiResponse.innerHTML = `<strong>Agent:</strong> For <strong>${metricName}</strong>, the record shows <strong>${countValue}</strong>.`;
        } else {
            aiResponse.innerHTML = "<strong>Agent:</strong> I couldn't find a direct match for that. Try asking about 'Total Parcels', 'Vacant Pipeline', or 'Supply Years'.";
        }

        aiResponse.style.display = "block";
    });

    // Enter Key Support
    askInput.addEventListener("keypress", (e) => { if (e.key === "Enter") askBtn.click(); });
</script>

</body>
</html>
