<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westfield Market Intelligence Dashboard</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --light: #ecf0f1;
            --dark: #34495e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--primary);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            text-align: center;
            padding: 20px;
            background: var(--light);
            border-radius: 6px;
            border-top: 4px solid var(--accent);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            display: block;
            color: var(--dark);
        }
        .stat-label {
            font-size: 14px;
            text-transform: uppercase;
            color: #7f8c8d;
        }
        .quote-box {
            font-style: italic;
            border-left: 5px solid var(--accent);
            padding: 15px 25px;
            background: #fffdfa;
            margin: 20px 0;
        }
        h1, h2 { color: var(--dark); }
        .data-source {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Westfield Market Analysis</h1>
    
    <div class="card">
        <h2>Supply & Absorption Metrics</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-value" id="ttm-total">...</span>
                <span class="stat-label">TTM Total Permits</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="monthly-rate">...</span>
                <span class="stat-label">Monthly Absorption</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="trend-indicator">...</span>
                <span class="stat-label">Current Trend</span>
            </div>
        </div>
        <p class="data-source">Source: MarketGraphics Regional Reports (2024-2026)</p>
    </div>

    <div class="card">
        <h2>Pipeline Context</h2>
        <div class="quote-box" id="pipeline-quote">
            Loading market analysis...
        </div>
    </div>

    <script>
        // Data derived from MarketGraphics Reports[cite: 1, 2, 3]
        const permitData = {
            2024: [155, 116, 178, 191, 183, 121, 115, 128, 155, 128, 77, 100],
            2025: [145, 99, 156, 95, 95, 95, 97, 78, 65, 64, 91, 173],
            2026: [133, 60, 91] // Q1 2026 Data[cite: 3]
        };

        function updateDashboard() {
            // 1. Calculate Trailing 12 Months (TTM)
            const allPermits = [
                ...permitData[2024], 
                ...permitData[2025], 
                ...permitData[2026]
            ];
            
            const last12Months = allPermits.slice(-12);
            const ttmTotal = last12Months.reduce((a, b) => a + b, 0);
            const monthlyRate = (ttmTotal / 12).toFixed(2);

            // 2. Calculate YoY Trend for the current month (March)
            const march26 = permitData[2026][2]; // 91
            const march25 = permitData[2025][2]; // 156
            const trend = (((march26 - march25) / march25) * 100).toFixed(0);

            // 3. Update UI Elements
            document.getElementById('ttm-total').textContent = ttmTotal.toLocaleString();
            document.getElementById('monthly-rate').textContent = monthlyRate;
            document.getElementById('trend-indicator').textContent = `${trend}% YoY`;

            // 4. Update the Pipeline Quote
            const quoteElement = document.getElementById('pipeline-quote');
            quoteElement.innerHTML = `
                "While Westfield remains a premier growth honors market, new supply is tightening significantly. 
                As of Q1 2026, the trailing 12-month absorption has adjusted to <strong>${monthlyRate} permits per month</strong>—a 
                notable decrease from the 2024 highs. This constriction in the pipeline, combined with limited 
                shovel-ready plat availability, suggests a looming supply vacuum for townhome developments 
                in the Noblesville-Westfield corridor."
            `;
        }

        // Initialize on load
        window.onload = updateDashboard;
    </script>
</body>
</html>
