<!-- Replace the existing AI Agent section in your HTML with this -->

<style>
    /* ... existing styles ... */
    
    #ai-agent-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    #agent-fab {
        width: 65px; height: 60px; border-radius: 50%; background: var(--dark);
        color: white; border: 3px solid white; cursor: pointer; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 28px;
    }
    
    #chat-window {
        display: none; width: 350px; height: 480px; background: white;
        border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        flex-direction: column; overflow: hidden; margin-bottom: 15px; border: 1px solid #eee;
    }

    .chat-header { background: var(--dark); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; max-width: 85%; }
    .bot-msg { background: #f0f2f5; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user-msg { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

    .chat-input-area { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 8px; background: white; }
    #chat-input { flex: 1; border: 1px solid #ddd; padding: 8px; border-radius: 20px; outline: none; }
</style>

<div id="ai-agent-container">
    <div id="chat-window">
        <div class="chat-header">
            <span>Product Analyst AI</span>
            <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg bot-msg">
                <strong>System Check Complete.</strong><br>
                I've verified the 27,859 parcels in the Westfield Tax District.[cite: 1]
            </div>
            <div class="msg bot-msg">
                The 3.4 Months of Supply (MOS) is confirmed as a blended overcount. SF Detached inventory is reaching critical scarcity.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask about zoning filter...">
            <button onclick="userSend()" style="background:var(--accent); border:none; color:white; border-radius:50%; width:35px; height:35px; cursor:pointer;">➔</button>
        </div>
    </div>
    <button id="agent-fab" onclick="toggleChat()">🤖</button>
</div>

<script>
    function toggleChat() {
        const chat = document.getElementById('chat-window');
        const isHidden = chat.style.display === 'none' || chat.style.display === '';
        chat.style.display = isHidden ? 'flex' : 'none';
    }

    function userSend() {
        const input = document.getElementById('chat-input');
        const msgContainer = document.getElementById('chat-messages');
        
        if (input.value.trim() !== "") {
            // Add User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.innerText = input.value;
            msgContainer.appendChild(userDiv);
            
            const query = input.value.toLowerCase();
            input.value = "";
            
            // Add "Thinking" delay
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'msg bot-msg';
                
                if (query.includes('zoning')) {
                    botDiv.innerHTML = "<strong>Phase 2 Module:</strong> I am ready to parse the GDB file to isolate SF-1 zoning parcels from SFA (Townhome) Pads.";
                } else {
                    botDiv.innerText = "Understood. I am analyzing the Q1 Pulte metrics to optimize the Westfield land acquisition strategy.";
                }
                
                msgContainer.appendChild(botDiv);
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }, 800);
        }
    }

    // Auto-trigger the chat after 2 seconds for a "Pro" demo feel
    window.addEventListener('load', () => {
        setTimeout(toggleChat, 2000);
    });
</script>
