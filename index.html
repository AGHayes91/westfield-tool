<div class="card">
    <h2>Inventory Health</h2>
    <div class="stats-grid">
        <!-- New Months of Supply Counter -->
        <div class="stat-box" style="border-top-color: #27ae60;">
            <span class="stat-value" id="mos-value">...</span>
            <span class="stat-label">Months of Supply (MOS)</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="inventory-count">...</span>
            <span class="stat-label">Standing Inventory</span>
        </div>
    </div>
</div>

<script>
    // Based on Pulte's Q1 2026 regional data and local permits[cite: 1, 3]
    function calculateMOS() {
        const monthlyAbsorption = 94.75; // Our TTM Average
        const currentInventory = 322;    // Estimated active units in Hamilton Co.
        
        const mos = (currentInventory / monthlyAbsorption).toFixed(1);
        
        document.getElementById('mos-value').textContent = mos;
        document.getElementById('inventory-count').textContent = currentInventory;
        
        // Update the AI Agent message to reflect this
        const chatBox = document.getElementById('chat-messages');
        const mosAlert = document.createElement('div');
        mosAlert.className = 'msg bot-msg';
        mosAlert.innerHTML = `<strong>Inventory Alert:</strong> Westfield is currently at <strong>${mos} months of supply</strong>. This indicates a tightening market favorable for the new Townhome phase.`;
        chatBox.appendChild(mosAlert);
    }
    // Call this inside your initDashboard function
</script>
